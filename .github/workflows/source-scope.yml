name: Frozen vendor documentation additions scope
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frozen-vendor-documentation-source-v2:
    name: frozen-vendor-documentation-source-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      BOOTSTRAP_BASE_SHA: 69b58c62545efb272cd5b29a1f1a501aabfca066
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate documentation, contract semantics and fail-closed source scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          source_ci="$RUNNER_TEMP/trusted-source-ci"
          mkdir -p "$source_ci"
          if [ "$BASE_SHA" = '458e8a18c6945f67d01746a2f7494bff7243f833' ]; then
            python .github/scripts/validate_scanner_upgrade.py
            cp -R .github "$source_ci/"
          elif git cat-file -e "$BASE_SHA:.github/source-scope.json" 2>/dev/null; then
            git diff --exit-code "$BASE_SHA" -- .github governance/interim-release-policy.json
            git archive "$BASE_SHA" .github | tar -x -C "$source_ci"
          else
            test "$BASE_SHA" = "$BOOTSTRAP_BASE_SHA"
            cp -R .github "$source_ci/"
          fi
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$source_ci/.github/requirements-source-scope.txt"
          python -m unittest discover -s "$source_ci/.github/scripts" -p 'test_*.py'
          python "$source_ci/.github/scripts/validate_source_scope.py"
      - name: Scan complete effective tree and tracked history for secrets
        shell: bash
        run: |
          set -euo pipefail
          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
          if [ -e .gitleaksignore ] || [ -L .gitleaksignore ]; then
            echo 'NATIVE_IGNORE_AUTHORITY_REJECTED: source root ignores forbidden' >&2
            exit 1
          fi
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/trusted-source-default.toml"
          : > "$RUNNER_TEMP/trusted-source-empty.ignore"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          rm -f "$RUNNER_TEMP/history-findings.redacted.json" "$RUNNER_TEMP/tree-findings.redacted.json"
          set +e
          "$RUNNER_TEMP/gitleaks" git --config "$RUNNER_TEMP/trusted-source-default.toml" --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/trusted-source-empty.ignore" --no-banner --redact=100 --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/history-findings.redacted.json" .
          history_status=$?
          "$RUNNER_TEMP/gitleaks" dir --config "$RUNNER_TEMP/trusted-source-default.toml" --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/trusted-source-empty.ignore" --no-banner --redact=100 --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/tree-findings.redacted.json" .
          tree_status=$?
          set -e
          python - <<'PYREPORT'
          import json, os
          from pathlib import Path
          for kind in ('history', 'tree'):
              path = Path(os.environ['RUNNER_TEMP']) / f'{kind}-findings.redacted.json'
              if path.exists():
                  findings = json.loads(path.read_text())
                  safe = [{key: item.get(key) for key in ('File', 'StartLine', 'RuleID', 'Commit', 'Fingerprint')} for item in findings]
                  print(json.dumps({'scan': kind, 'finding_metadata': safe}, sort_keys=True))
          PYREPORT
          python "$RUNNER_TEMP/trusted-source-ci/.github/scripts/verify_secret_findings.py" \
            --history-report "$RUNNER_TEMP/history-findings.redacted.json" \
            --tree-report "$RUNNER_TEMP/tree-findings.redacted.json" \
            --history-status "$history_status" --tree-status "$tree_status" \
            --self-test-scanner "$RUNNER_TEMP/gitleaks"
      - name: Prove scanner suppression attempts fail closed
        shell: bash
        run: bash .github/scripts/test_secret_scanner.sh
